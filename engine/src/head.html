<!DOCTYPE html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      /* Cyber Sketch style (references/style-spec.md). Fonts (SIL OFL): Kanit 600/800 (Thai headlines), Mali 500/700 (handwritten Thai leads, notes, chips),
         JetBrains Mono (labels, code, numbers). Host + cards = paper stickers with a boiling edge (3 frames @ 8 fps). */
      @font-face { font-family: "Kanit"; font-weight: 400; font-display: block; src: url("assets/fonts/Kanit-Regular.ttf") format("truetype"); }
      @font-face { font-family: "Kanit"; font-weight: 600; font-display: block; src: url("assets/fonts/Kanit-SemiBold.ttf") format("truetype"); }
      @font-face { font-family: "Kanit"; font-weight: 800; font-display: block; src: url("assets/fonts/Kanit-ExtraBold.ttf") format("truetype"); }
      @font-face { font-family: "Mali"; font-weight: 500; font-display: block; src: url("assets/fonts/Mali-Medium.ttf") format("truetype"); }
      @font-face { font-family: "Mali"; font-weight: 700; font-display: block; src: url("assets/fonts/Mali-Bold.ttf") format("truetype"); }
      @font-face { font-family: "JBMono"; font-weight: 100 800; font-display: block; src: url("assets/fonts/JetBrainsMono.ttf") format("truetype"); }

      :root { --paper: #F4F1EA; --paper2: #E2DCCF; --ink: #1E2533; --soft: #5B6577; --red: #E0393E; --red2: #F06B5E; --cyan: #1C9FD6; --glow: #5FD8FF;
              --violet: #6A4BB0; --amber: #F0A21B; --term: #1B222C; --green: #3DDC84; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #EAF1F6; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #EAF1F6; font-family: "Mali", sans-serif; color: var(--ink); }
      .full { position: absolute; inset: 0; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene > .inner { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
      .cam { position: absolute; inset: 0; transform-origin: 50% 45%; }

      /* sci-fi pages: cool holo-paper with a cyan minor/major grid, a HUD frame (assets/bd/hud*.svg, from tools/backdrops.py) and faint CRT scanlines.
         .dk = red "threat" page; .nt = dark terminal page with a glowing perspective floor (tron.svg) */
      .pg { position: absolute; inset: 0; background:
          url(assets/bd/hud.svg) 0 0 / 1080px 1920px no-repeat,
          radial-gradient(circle, rgba(28,111,160,.30) 2.5px, transparent 3px) -60px -60px / 120px 120px,
          linear-gradient(rgba(28,111,160,.13) 2px, transparent 2px) 0 0 / 120px 120px,
          linear-gradient(90deg, rgba(28,111,160,.13) 2px, transparent 2px) 0 0 / 120px 120px,
          linear-gradient(rgba(28,159,214,.07) 1px, transparent 1px) 0 0 / 30px 30px,
          linear-gradient(90deg, rgba(28,159,214,.07) 1px, transparent 1px) 0 0 / 30px 30px,
          radial-gradient(ellipse at 50% 38%, #FBFDFE 0%, #EAF1F6 50%, #C9D6E2 100%); }
      .pg::after { content: ""; position: absolute; inset: 0; pointer-events: none;
          background: repeating-linear-gradient(0deg, rgba(30,37,51,.035) 0 2px, transparent 2px 5px),
                      radial-gradient(ellipse at 50% 30%, rgba(95,216,255,.16), transparent 60%); }
      .pg.dk { background:
          url(assets/bd/hud-red.svg) 0 0 / 1080px 1920px no-repeat,
          radial-gradient(circle, rgba(184,50,58,.28) 2.5px, transparent 3px) -60px -60px / 120px 120px,
          linear-gradient(rgba(184,50,58,.12) 2px, transparent 2px) 0 0 / 120px 120px,
          linear-gradient(90deg, rgba(184,50,58,.12) 2px, transparent 2px) 0 0 / 120px 120px,
          linear-gradient(rgba(184,50,58,.06) 1px, transparent 1px) 0 0 / 30px 30px,
          linear-gradient(90deg, rgba(184,50,58,.06) 1px, transparent 1px) 0 0 / 30px 30px,
          radial-gradient(ellipse at 50% 40%, #F8EFEF 0%, #E9DADC 55%, #C9AFB3 100%); }
      .pg.dk::after { background: repeating-linear-gradient(0deg, rgba(60,20,25,.045) 0 2px, transparent 2px 5px),
                      radial-gradient(ellipse at 50% 30%, rgba(240,107,94,.14), transparent 60%); }
      .pg.nt { background:
          url(assets/bd/hud-dark.svg) 0 0 / 1080px 1920px no-repeat,
          url(assets/bd/tron.svg) 0 0 / 1080px 1920px no-repeat,
          linear-gradient(rgba(95,216,255,.07) 1px, transparent 1px) 0 0 / 30px 30px,
          linear-gradient(90deg, rgba(95,216,255,.07) 1px, transparent 1px) 0 0 / 30px 30px,
          radial-gradient(ellipse at 50% 40%, #1C2A3C 0%, #111A26 55%, #070B11 100%); }
      .pg.nt::after { background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 5px),
                      radial-gradient(ellipse at 50% 30%, rgba(95,216,255,.12), transparent 60%); }
      .pg.nt ~ * .h, .pg.nt ~ * .tt { color: #EAF4FA; } .pg.nt ~ * .s { color: #9FB3C8; } .pg.nt ~ * .r { color: var(--red2); } .pg.nt ~ * .stamp, .pg.nt ~ .stamp { mix-blend-mode: normal; border-color: var(--red2); color: var(--red2); } .pg.nt ~ .term, .pg.nt ~ * .term { border-color: #3A4658; }
      .bd { position: absolute; mix-blend-mode: multiply; pointer-events: none; filter: sepia(1) hue-rotate(160deg) saturate(2.2); }
      .pg.nt ~ * .bd, .pg.nt ~ .bd { mix-blend-mode: screen; filter: invert(1) sepia(1) hue-rotate(150deg) saturate(3); }
      .scrib { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: .55; }

      /* type */
      .tz { position: absolute; left: 90px; right: 120px; top: 290px; height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; text-align: center; }
      .h { font-family: "Kanit", sans-serif; font-weight: 800; font-size: 112px; line-height: 1.18; color: var(--ink); white-space: nowrap; text-shadow: 0 5px 0 rgba(30,37,51,.10); }
      .h.xl { font-size: 132px; } .h.m { font-size: 94px; } .h.sm { font-size: 78px; }
      .r { color: var(--red); } .c { color: var(--cyan); } .v { color: var(--violet); } .a { color: var(--amber); }
      .s { font-family: "Mali", sans-serif; font-weight: 700; font-size: 54px; line-height: 1.35; color: var(--soft); white-space: nowrap; }
      .lab { font-family: "JBMono", monospace; font-weight: 700; font-size: 34px; letter-spacing: .14em; color: var(--violet); white-space: nowrap; text-transform: uppercase; }
      .num { font-family: "JBMono", monospace; font-weight: 800; white-space: nowrap; }
      .se { font-family: "JBMono", monospace; font-weight: 500; color: var(--soft); white-space: nowrap; }
      .w { display: inline-block; opacity: 0; }
      .sw { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
      .rule { display: flex; align-items: center; gap: 14px; justify-content: center; margin: 6px auto 12px; }
      .rule i { height: 4px; width: 170px; background: var(--ink); opacity: .75; border-radius: 2px; } .rule b { width: 18px; height: 18px; background: var(--cyan); border: 3px solid var(--ink); border-radius: 4px; }
      /* caption chip: handwritten note on a cream highlight, like a label stuck on the page */
      .chip { display: inline-block; font-family: "Mali", sans-serif; font-weight: 700; font-size: 44px; padding: 6px 22px 10px; background: #FBF6E4; border: 3px solid rgba(30,37,51,.15);
              box-shadow: 3px 4px 0 rgba(30,37,51,.12); color: var(--ink); white-space: nowrap; transform: rotate(-1.5deg); }

      /* paper card: 3 boil frames under the content. Size = content + 60px pad each side */
      .tc { position: absolute; opacity: 0; }
      .tc > img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .tc > .ct { position: absolute; inset: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .tt { font-family: "Kanit", sans-serif; font-weight: 600; color: var(--ink); white-space: nowrap; line-height: 1.25; }
      /* window bar for a card that should read as an app / browser window: <div class="bar"><i></i><i></i><i></i><span>url</span></div> as first child of .ct */
      .ct:has(> .bar) { padding-top: 56px; }
      .bar { position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 3px solid var(--ink); }
      .bar i { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--ink); } .bar i:nth-child(1) { background: var(--red); } .bar i:nth-child(2) { background: var(--amber); } .bar i:nth-child(3) { background: var(--green); }
      .bar span { margin-left: 12px; font-family: "JBMono", monospace; font-size: 24px; color: var(--soft); white-space: nowrap; }
      /* boil: #root[data-f] steps 0,1,2 at 8 fps; every boil set has .b0 .b1 .b2 */
      .b1, .b2 { visibility: hidden; }
      #root[data-f="1"] .b0, #root[data-f="2"] .b0 { visibility: hidden; }
      #root[data-f="1"] .b1, #root[data-f="2"] .b2 { visibility: visible; }

      /* host: paper-sticker analyst, lower 42% */
      .host { position: absolute; top: 1100px; width: 860px; height: 860px; transform-origin: 50% 100%; }
      .host.L { left: -170px; } .host.R { left: 390px; } .host.C { left: 110px; }
      .host .br { position: absolute; inset: 0; transform-origin: 50% 100%; }
      .host .pz { position: absolute; inset: 0; opacity: 0; }
      .host .pz.m { transform: scaleX(-1); }
      .host img { position: absolute; inset: 0; width: 860px; height: 860px; }
      .host.sm, .host.sm img { width: 880px; height: 880px; }

      /* sketch props (inline SVG, navy ink, wobble + watercolour filters) */
      .svg { position: absolute; opacity: 0; }
      .svg svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .ink:not([fill]) { fill: none; } .ink { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .mk { fill: none; stroke: var(--red); stroke-linecap: round; stroke-linejoin: round; } .mk.cy { stroke: var(--cyan); }
      /* container box (as in the reference): violet rounded outline holding icons; .box.off = the box "goes dark" */
      .box { position: absolute; border: 6px solid var(--violet); border-radius: 34px; background: rgba(226,220,207,.55); opacity: 0; }
      .box > .bl { position: absolute; left: 0; right: 0; top: -66px; text-align: center; font-family: "Kanit", sans-serif; font-weight: 600; font-size: 44px; color: var(--violet); white-space: nowrap; }
      .box > .off { position: absolute; inset: 0; border-radius: 28px; background: var(--term); opacity: 0; }
      /* terminal panel: dark window with mono text; lines are .w spans so they type in */
      .term { position: absolute; background: var(--term); border: 5px solid var(--ink); border-radius: 22px; padding: 70px 34px 30px; opacity: 0; box-shadow: 8px 10px 0 rgba(30,37,51,.18);
              font-family: "JBMono", monospace; font-size: 34px; line-height: 1.5; color: var(--green); white-space: nowrap; text-align: left; }
      .term::before { content: ""; position: absolute; left: 22px; top: 22px; width: 18px; height: 18px; border-radius: 50%; background: var(--red); box-shadow: 30px 0 0 var(--amber), 60px 0 0 var(--green); }
      .term .er { color: var(--red2); } .term .ok { color: var(--glow); } .term .dim { color: #7D8DA0; }
      /* rubber stamp (replaces the wax seal): red or cyan ink frame, uppercase mono or Thai Kanit */
      .stamp { position: absolute; opacity: 0; padding: 10px 30px; border: 9px solid var(--red); border-radius: 14px; color: var(--red); font-family: "Kanit", sans-serif; font-weight: 800; font-size: 72px;
               letter-spacing: .04em; white-space: nowrap; mix-blend-mode: multiply; filter: url(#stampf); }
      .stamp.cy { border-color: var(--cyan); color: var(--cyan); }
      .tape { position: absolute; width: 150px; height: 44px; background: rgba(190,214,232,.75); box-shadow: 0 1px 0 rgba(0,0,0,.08); opacity: 0; }

      /* overlays */
      #fiber { pointer-events: none; mix-blend-mode: multiply; opacity: .18; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='500'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .43 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='500' height='500' filter='url(%23n)'/></svg>"); }
      #blot { pointer-events: none; mix-blend-mode: multiply; opacity: .08; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.004' numOctaves='3' seed='9'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .5 0 0 0 0 .6 0 0 0 1.2 -.45'/></filter><rect width='1080' height='1920' filter='url(%23b)'/></svg>"); }
      #vig { pointer-events: none; box-shadow: inset 0 0 160px 30px rgba(20,60,95,.28), inset 0 0 24px 4px rgba(20,40,60,.25); }
      /* slow holo sweep: a faint cyan band drifting down the screen every 5 s */
      #holo { pointer-events: none; overflow: hidden; }
      @keyframes hs { 0% { transform: translateY(-300px); } 100% { transform: translateY(2100px); } }
      #holo i { position: absolute; left: 0; right: 0; top: 0; height: 220px; mix-blend-mode: screen; opacity: .35;
        background: linear-gradient(transparent, rgba(95,216,255,.18) 70%, rgba(95,216,255,.5) 96%, transparent); animation: hs 5s linear infinite; }
      #flash { position: absolute; inset: 0; background: #FFFFFF; opacity: 0; }
      #alert { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(240,70,70,.25), rgba(200,30,40,.75)); opacity: 0; mix-blend-mode: multiply; }
      #dark { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, #26303D, #0D1117); opacity: 0; }
      #scan { position: absolute; left: 0; right: 0; top: 0; height: 26px; opacity: 0; background: linear-gradient(transparent, rgba(95,216,255,.9) 45%, #fff 50%, rgba(95,216,255,.9) 55%, transparent); box-shadow: 0 0 40px 10px rgba(95,216,255,.5); }
      #glitch { position: absolute; inset: 0; opacity: 0; pointer-events: none; background:
          repeating-linear-gradient(0deg, rgba(95,216,255,.0) 0 22px, rgba(95,216,255,.35) 22px 30px, rgba(224,57,62,.0) 30px 64px, rgba(224,57,62,.3) 64px 70px); mix-blend-mode: multiply; }
      #grain { pointer-events: none; overflow: hidden; }
      @keyframes gr { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-4%,3%)} 50%{transform:translate(3%,-4%)} 75%{transform:translate(-2%,-3%)} }
      #grain i { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; opacity: .10; mix-blend-mode: multiply;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .15 0 0 0 0 .18 0 0 0 0 .25 0 0 0 .6 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        animation: gr .5s steps(1) infinite; }

      /* EP2 illustration layouts (video-4) */
      .pic { position: absolute; opacity: 0; background: #fff; border: 14px solid #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 4px var(--ink), 12px 16px 0 rgba(30,37,51,.22); }
      .pic img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      .pic.win { padding-top: 52px; } .pic.win img { top: 52px; height: calc(100% - 52px); }
      .pic .scanl { position: absolute; left: 0; right: 0; top: 0; height: 18px; background: linear-gradient(transparent, rgba(95,216,255,.9), transparent); box-shadow: 0 0 30px 8px rgba(95,216,255,.5); }
      .blend { position: absolute; opacity: 0; mix-blend-mode: multiply; overflow: hidden; }
      .blend img { width: 100%; height: 100%; object-fit: cover; }
      .fullimg { position: absolute; inset: 0; overflow: hidden; } .fullimg img { width: 100%; height: 100%; object-fit: cover; }
      .band { position: absolute; left: 0; right: 0; top: 0; height: 760px; background: linear-gradient(rgba(10,14,22,.92) 55%, transparent); }
      .wt { color: #EAF4FA !important; } .wt.r { color: var(--red2) !important; }
      .leak { position: absolute; width: 190px; height: 190px; border: 7px solid var(--ink); border-radius: 30px; background: #fff; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              font-family: "Kanit"; font-weight: 800; box-shadow: 8px 10px 0 rgba(30,37,51,.2); }
      .leak b { font-size: 92px; line-height: 1; } .leak i { font-style: normal; font-family: "JBMono"; font-size: 26px; letter-spacing: .1em; color: var(--soft); }
      .cbub { position: absolute; background: #fff; border: 6px solid var(--ink); border-radius: 36px 36px 36px 8px; padding: 6px 34px 12px; font-family: "Kanit"; font-weight: 800; font-size: 70px; opacity: 0; box-shadow: 6px 8px 0 rgba(30,37,51,.2); }
          .cut { position: absolute; opacity: 0; } .cut .lv { width: 100%; height: 100%; transform-origin: 50% 85%; } .cut img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 16px 14px rgba(30,37,51,.28)); }
      .pg.nt ~ * .cut img, .pg.nt ~ .cut img { filter: drop-shadow(0 0 24px rgba(95,216,255,.35)) drop-shadow(0 16px 14px rgba(0,0,0,.5)); }
      /* EP.05 */
      .acro { position: absolute; left: 90px; opacity: 0; display: flex; align-items: baseline; gap: 6px; font-family: "Kanit"; font-weight: 800; }
      .acro b { font-size: 190px; line-height: 1; color: #5FD8FF; text-shadow: 0 0 30px rgba(95,216,255,.6); } .acro span { font-size: 110px; color: #EAF4FA; }
      .streaks { position: absolute; inset: 0; opacity: 0; background: repeating-linear-gradient(90deg, transparent 0 60px, rgba(28,159,214,.35) 60px 66px, transparent 66px 150px); }
      /* EP.04 */
      .num { position: absolute; opacity: 0; border: 12px solid; border-radius: 40px; background: #fff; display: flex; align-items: center; justify-content: center; font-family: "Kanit"; font-weight: 800; line-height: 1; box-shadow: 10px 14px 0 rgba(30,37,51,.2); }
      .blip { position: absolute; width: 60px; height: 60px; margin: -30px; border-radius: 50%; background: var(--red); opacity: 0; box-shadow: 0 0 0 10px rgba(224,57,62,.25), 0 0 40px 10px rgba(224,57,62,.5); }
      .cap { position: absolute; width: 300px; height: 300px; opacity: 0; border: 9px solid; border-radius: 34px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: 8px 12px 0 rgba(30,37,51,.2); }
      .cap b { font-size: 120px; line-height: 1; } .cap i { font-style: normal; font-family: "Kanit"; font-weight: 800; font-size: 46px; }
      .big { position: absolute; left: 0; right: 0; text-align: center; font-family: "Kanit"; font-weight: 800; font-size: 330px; line-height: 1; color: var(--red); opacity: 0; -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; }
      .s10cap { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-family: "Kanit"; font-weight: 600; font-size: 62px; color: var(--ink); }
      .waffle { position: absolute; width: 520px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px; opacity: 0; }
      .waffle i { display: block; aspect-ratio: 1; border-radius: 50%; background: #C9D3DE; border: 3px solid var(--ink); }
      .pick { position: absolute; width: 310px; height: 380px; opacity: 0; border: 10px solid; border-radius: 26px; overflow: hidden; background: #fff; box-shadow: 8px 12px 0 rgba(30,37,51,.22); }
      .pick img { width: 100%; height: 100%; object-fit: cover; } .pick b { position: absolute; left: 14px; top: 10px; width: 92px; height: 92px; border-radius: 50%; color: #fff; font-family: "Kanit"; font-weight: 800; font-size: 66px; line-height: 88px; text-align: center; border: 5px solid #fff; }
      /* EP.07 */
      .ring { position: absolute; border-radius: 50%; border: 10px solid var(--red); opacity: 0; box-shadow: 0 0 30px rgba(224,57,62,.5), inset 0 0 30px rgba(224,57,62,.35); }
      .xm { position: absolute; font-family: "Kanit"; font-weight: 800; font-size: 120px; color: var(--red); opacity: 0; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
      /* hook on frame 0: scene 1, its picture and Moon are visible before the timeline starts (auto thumbnail) */
      #s01 .inner, #s01-im, #s01-host .pz:first-child { opacity: 1; }
      #s01-r0, #s10-r0, #s10-r1 { border-color: #1C9FD6; box-shadow: 0 0 30px rgba(28,159,214,.5), inset 0 0 30px rgba(28,159,214,.35); }

      /* ===== LAB LOOK (series "หลอก AI ได้ไหม?", EP9+): lab-notebook page, mint + violet ===== */
      :root { --cyan: #14A57E; --mint: #3FD1A6; --mint2: #BFF3E2; --red: #E8475F; --red2: #F07A8B; --violet: #6A4BB0; --lav: #B9A6F0; }
      html, body, #root { background: #F3FBF8; }
      .pg { background:
          radial-gradient(circle at 12% 18%, rgba(63,209,166,.18) 0 34px, transparent 36px),
          radial-gradient(circle at 88% 30%, rgba(185,166,240,.22) 0 26px, transparent 28px),
          radial-gradient(circle at 80% 86%, rgba(63,209,166,.16) 0 46px, transparent 48px),
          radial-gradient(circle at 8% 74%, rgba(185,166,240,.18) 0 22px, transparent 24px),
          linear-gradient(rgba(63,209,166,.22) 2px, transparent 2px) 0 0 / 120px 120px,
          linear-gradient(90deg, rgba(63,209,166,.22) 2px, transparent 2px) 0 0 / 120px 120px,
          linear-gradient(rgba(63,209,166,.10) 1px, transparent 1px) 0 0 / 30px 30px,
          linear-gradient(90deg, rgba(63,209,166,.10) 1px, transparent 1px) 0 0 / 30px 30px,
          radial-gradient(ellipse at 50% 40%, #FFFFFF 0%, #F3FBF8 55%, #DCD3F2 100%); }
      .pg::after { background: linear-gradient(90deg, transparent 0 96px, rgba(232,71,95,.28) 96px 99px, transparent 99px),
                   radial-gradient(ellipse at 50% 30%, rgba(191,243,226,.35), transparent 60%); }
      .pg.dk { background:
          linear-gradient(rgba(106,75,176,.20) 2px, transparent 2px) 0 0 / 120px 120px,
